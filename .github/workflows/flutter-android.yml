name: Flutter Android

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://10.0.2.2/lamshaml/backend/public' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lam-shaml-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
